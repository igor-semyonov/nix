scheme: "igix"
author: "Igor"

# --- BASE 16 (Standard UI & Syntax) ---
# Backgrounds: base00 is the ONLY pure black. base01/base02 are deliberately
# lifted off black so GTK dialogs, cards, headerbars and (critically) buttons
# have a visible surface. Without this, apps like virt-manager draw buttons at
# near-black on near-black and they vanish.
base00: "000000" # Pure Pitch Black (Main window / view / terminal background)
base01: "202020" # Raised surfaces (dialogs, cards, headerbars, popovers, buttons)
base02: "343434" # Selections, borders, scrollbars, entry fields
base03: "6e6e6e" # Mid Grey (Comments, inactive elements)
base04: "b0b0b0" # Light Grey (Secondary text)
base05: "ffffff" # Pure White (Main text - maximum contrast)
base06: "f5f5f5" # Off White (Light text)
base07: "ffffff" # Pure White (Light background - rarely used)

base08: "ff2d55" # Neon Red (Errors, destructive actions)
base09: "ff8800" # Vivid Orange (Warnings, orange palette slot)
base0A: "ffcc00" # Neon Yellow (Search matches)
base0B: "00ff9c" # Neon Green (Strings, success)
base0C: "22ccff" # Neon Cyan/Blue (Regex, escapes)
base0D: "ff9000" # PRIMARY ACCENT / HIGHLIGHT (Orange) - focus rings, selections,
                 # GTK accent, Firefox accent. Matches Alacritty selection bg.
base0E: "c400ff" # Vivid Purple (Keywords, secondary bright accent)
base0F: "ff00cc" # Hot Pink (Deprecated / misc)

# --- BASE 24 (Extended Terminal & High-Contrast States) ---
base10: "000000" # Darkest Background (Kept pitch black for true OLED effect)
base11: "0a0a0a" # Darker Background (Subtle separation for deep UI layers)
base12: "555555" # Bright Black / Darkest Foreground (Terminal color 8)
base13: "ffffff" # Brightest Foreground (Terminal color 15)
base14: "ff5577" # Alternate Red (Bright Crimson)
base15: "ffaa00" # Alternate Orange (Bright Amber / Warning pop)
base16: "ffdd33" # Alternate Yellow (Bright Gold)
base17: "33ffbb" # Alternate Green (Bright Mint)
